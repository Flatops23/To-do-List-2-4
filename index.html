<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev_Task_Terminal</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#272822">
    <style>
        :root {
            --bg: #272822; /* Monokai Background */
            --text: #f8f8f2;
            --accent: #a6e22e; /* Green */
            --delete: #f92672; /* Pink */
            --input-bg: #3e3d32;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            padding-top: 50px;
        }

        .terminal-window {
            width: 90%;
            max-width: 600px;
            border: 1px solid #555;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .header {
            background: #333;
            padding: 5px 15px;
            font-size: 12px;
            color: #aaa;
            border-bottom: 1px solid #555;
        }

        .content {
            padding: 20px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex-grow: 1;
            background: var(--input-bg);
            border: 1px solid #555;
            color: var(--accent);
            padding: 10px;
            outline: none;
        }

        button#addBtn {
            background: var(--accent);
            color: var(--bg);
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-weight: bold;
        }

        ul { list-style: none; padding: 0; }

        li {
            background: rgba(255,255,255,0.05);
            margin-bottom: 8px;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid var(--accent);
        }

        .del-btn {
            background: transparent;
            color: var(--delete);
            border: 1px solid var(--delete);
            padding: 2px 8px;
            cursor: pointer;
        }
        
        .del-btn:hover { background: var(--delete); color: white; }
    </style>
</head>
<body>

    <div class="terminal-window">
        <div class="header">main.js - Todo_App</div>
        <div class="content">
            <div class="input-group">
                <input type="text" id="taskInput" placeholder="const task = '...'">
                <button id="addBtn" onclick="addTask()">PUSH</button>
            </div>
            <ul id="taskList"></ul>
        </div>
    </div>

    <script>
        const taskList = document.getElementById("taskList");

        function addTask() {
            const input = document.getElementById("taskInput");
            const task = input.value.trim();
            
            if(task) {
                const li = document.createElement("li");
                // Implementing the logic from your screenshots
                li.innerHTML = `
                    <span>> ${task}</span>
                    <button class="del-btn" onclick="this.parentElement.remove()">DROP</button>
                `;
                taskList.appendChild(li);
                input.value = "";
            }
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js');
            });
        }
    </script>
</body>
</html>
