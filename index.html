<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cream White Todo PWA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#F5F5DC">
    <style>
        body { 
            background-color: #F5F5DC; /* Cream White */
            min-height: 100vh;
        }
        .card {
            border: none;
            border-radius: 15px;
        }
    </style>
</head>
<body>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6">
                <div id="todo-container" class="card shadow p-4">
                    <h2 class="text-center mb-4">My Tasks</h2>
                    
                    <div class="input-group mb-3">
                        <input type="text" id="taskInput" class="form-control" placeholder="Add a new task...">
                        <button class="btn btn-primary" onclick="addTask()">Add</button>
                    </div>

                    <ul id="taskList" class="list-group">
                        </ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Logic based on your screenshots
        const taskList = document.getElementById("taskList");

        function addTask() {
            const input = document.getElementById("taskInput");
            const task = input.value.trim();
            
            if(task) {
                const li = document.createElement("li");
                // Bootstrap classes for layout: d-flex and justify-content-between
                li.className = "list-group-item d-flex justify-content-between align-items-center mb-2 rounded shadow-sm border";
                
                li.innerHTML = `
                    <span>${task}</span>
                    <button class="btn btn-outline-danger btn-sm" onclick="this.parentElement.remove()">X</button>
                `;
                
                taskList.appendChild(li);
                input.value = "";
            }
        }

        // Service Worker registration for mobile icon support
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                .then(reg => console.log('PWA Ready'))
                .catch(err => console.log('PWA Setup failed', err));
            });
        }
    </script>
</body>
</html>
